name = "meo-harness"
main = "worker/index.mjs"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = false

# ── KV: 店舗設定 ──────────────────────────────────────────────────────────────
# ローカル dev では wrangler が自動でエミュレート。
# デプロイ前に `wrangler kv namespace create STORES` で id を取得して置き換える。
[[kv_namespaces]]
binding = "STORES"
id = "8bcb74e16c5d4f46a440b20856e44de9"

# 共有サービス専用DB。既存KV店舗は移行せず、location_claimsだけ予約する。
[[d1_databases]]
binding = "SELF_DB"
database_name = "meo-harness-self-service"
database_id = "2ab45bdf-d704-4aed-9e44-fe3ea6038169"
migrations_dir = "migrations"

# ── Secrets（値は .dev.vars / Workers Secrets で供給） ────────────────────────
# GROQ_API_KEY             : AI返信エンジン（Groq、無料枠）
# ADMIN_KEY                : /admin/* 管理エンドポイントの認証キー
# WHATSAPP_TOKEN           : Meta System User Token（Business Manager で発行）
# WHATSAPP_PHONE_NUMBER_ID : WhatsApp 送信元電話番号 ID（テスト: 1222481350942430）
# WHATSAPP_VERIFY_TOKEN    : WhatsApp Webhook 検証トークン（任意文字列）
# GBP_OAUTH_CLIENT_ID      : Google Cloud Console OAuth クライアント ID
# GBP_OAUTH_CLIENT_SECRET  : Google Cloud Console OAuth クライアントシークレット
# LINE_CHANNEL_SECRET      : LINE Bot チャネルシークレット（Webhook 署名検証）
# TURNSTILE_SECRET_KEY      : 自己登録/ログインのサーバー側検証（公開しない）
# SELF_PILOT_OWNER_SHA256   : 接続確認を許可する認証済みGoogle subjectのSHA-256（非公開）
# GMAIL_REFRESH_TOKEN      : Gmail OAuth refresh_token（GBP 承認前メール監視）

[vars]
VERSION = "0.1.0"
SELF_REGISTRATION_ENABLED = "true"
SELF_PROCESSING_ENABLED = "true"
SELF_LINE_BUTTON_CONFIRM_ENABLED = "true"
SELF_LINE_AUTO_BUTTON_ENABLED = "true"
SELF_LINE_ONE_BUTTON_ENABLED = "true"
SELF_LINE_AUTO_PIN_ENABLED = "false"
SELF_PUBLIC_ORIGIN = "https://meo-harness.yosinn1.workers.dev"
TURNSTILE_SITE_KEY = "0x4AAAAAAFE6uTVTTIAlwcWr"
# Secret SELF_PILOT_OWNER_SHA256 を置くと、受付と処理を止めた本人限定モードになる。本番では置かない。
# SELF_LINE_CHECK_DAILY_BYPASS_ENABLED は運営者本人だけの一時設定なので、ここには書かない。ダッシュボードで管理し、deploy の --keep-vars で残す。
SELF_MAX_ACTIVE_STORES = "10"
SELF_MONTHLY_DRAFT_LIMIT = "30"
SELF_MONTHLY_PUSH_LIMIT = "150"
SELF_LEGACY_PUSH_RESERVE = "30"
SELF_LINE_FRIEND_URL = "https://line.me/R/ti/p/@477byprh"
SELF_TERMS_VERSION = "2026-09-27"
# Google Search Console所有権確認（公開ファイル名。消すとブランド検証が外れる）
SELF_GOOGLE_SITE_VERIFICATION_FILE = "google3031925227c81399.html"

# ── Cron Trigger: 5分ごとに1つの仕事（UTCの分で役割を決める）。旧処理は毎時00分だけ ──
# :00 片付け＋旧処理 / :05 :35 取得 / :10 :20 :30 :40 :50 下書き / :15 :45 :55 通知 / :25 照合
# 旧処理のタイムゾーン対応ダイジェスト（各店舗の現地9:00）は毎時00分の回で今までどおり判定する。
# 戻すときはコードとこの行を必ず一緒に戻す（古いコードのまま */5 だと旧処理が1時間に12回走る）。
[triggers]
crons = ["*/5 * * * *"]

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.txt", "**/*.md"]
fallthrough = true
